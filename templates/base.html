<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="{% block description %}{{ profile.seo.description }}{% endblock %}">
  <meta name="author" content="{{ profile.name }}">
  <meta name="theme-color" content="#f6f3ec">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="{{ profile.seo.url }}">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="icon" type="image/png" href="favicon.png">

  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ profile.name }}">
  <meta property="og:description" content="{{ profile.seo.description }}">
  <meta property="og:url" content="{{ profile.seo.url }}">
  <meta property="og:image" content="{{ profile.seo.url }}{{ profile.seo.image }}">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Billy Rebecchi, full stack engineer and computer science teacher, with nine screenshots of his projects">
  <meta property="og:site_name" content="{{ profile.name }}">
  <meta property="og:locale" content="en_GB">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ profile.name }}">
  <meta name="twitter:description" content="{{ profile.seo.description }}">
  <meta name="twitter:image" content="{{ profile.seo.url }}{{ profile.seo.image }}">
  <meta name="twitter:image:alt" content="Billy Rebecchi, full stack engineer and computer science teacher, with nine screenshots of his projects">

  <script type="application/ld+json">
{{ person_schema | tojson(indent=2) }}
  </script>

  <script>
    /* Set the theme before anything paints, so there is no flash. */
    (function () {
      var root = document.documentElement;
      root.classList.add('js');
      var stored = null;
      try { stored = window.localStorage.getItem('theme'); } catch (e) { /* private mode */ }
      var dark = stored
        ? stored === 'dark'
        : window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.setAttribute('data-theme', dark ? 'dark' : 'light');
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) { meta.setAttribute('content', dark ? '#0c1016' : '#f6f3ec'); }
    })();
  </script>

  <title>{% block title %}{{ profile.name }}{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header">
    <div class="container header-inner">
      <a class="monogram" href="#top">
        <span aria-hidden="true">BR<span class="dot">.</span></span>
        <span class="sr-only">Back to top</span>
      </a>
      <nav class="site-nav" aria-label="Sections">
        <ul>
          <li><a href="#work">Featured</a></li>
          <li><a href="#games">Games</a></li>
          <li><a href="#apps">Apps</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"></path>
        </svg>
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="4"></circle>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
        </svg>
      </button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <div class="container">
      {% block content %}{% endblock %}
    </div>
  </main>

  <script>
    (function () {
      var button = document.getElementById('theme-toggle');
      if (!button) { return; }
      var root = document.documentElement;
      var meta = document.querySelector('meta[name="theme-color"]');

      function label() {
        var dark = root.getAttribute('data-theme') === 'dark';
        button.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
      }

      function sync() {
        if (meta) {
          meta.setAttribute('content',
            root.getAttribute('data-theme') === 'dark' ? '#0c1016' : '#f6f3ec');
        }
        label();
      }

      button.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        try { window.localStorage.setItem('theme', next); } catch (e) { /* private mode */ }
        sync();
      });

      /* Follow the operating system until the visitor makes a choice. */
      if (window.matchMedia) {
        var query = window.matchMedia('(prefers-color-scheme: dark)');
        var onChange = function (event) {
          var stored = null;
          try { stored = window.localStorage.getItem('theme'); } catch (e) { /* private mode */ }
          if (stored) { return; }
          root.setAttribute('data-theme', event.matches ? 'dark' : 'light');
          sync();
        };
        if (query.addEventListener) {
          query.addEventListener('change', onChange);
        } else if (query.addListener) {
          query.addListener(onChange);
        }
      }

      sync();
    })();
  </script>
</body>
</html>
